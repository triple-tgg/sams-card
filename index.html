<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS Name Card</title>
    <link rel="shortcut icon" href="/img/sam-logo-1.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css">

    <!-- PWA / Add to Home Screen (manifest is injected dynamically by JS) -->
    <meta name="theme-color" content="#1e3a5f">

    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAMS Card">
    <link rel="apple-touch-icon" href="/img/sam-logo-1.png">
    <style>
        .icon-position,
        .icon-email,
        .icon-telphone,
        .icon-whatsapp {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-whatsapp svg {
            width: 28px;
            height: 28px;
        }

        /* Long name overflow fix */
        .firstname,
        .lastname {
            overflow: hidden;
            white-space: normal;
            word-break: break-word;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(30, 58, 95, 0.15);
            border-top: 4px solid #1e3a5f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #1e3a5f;
            font-size: 16px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* Error State */
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 16px;
            padding: 40px;
            text-align: center;
        }

        .error-icon {
            font-size: 48px;
            opacity: 0.6;
        }

        .error-title {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #1e3a5f;
            font-size: 22px;
            font-weight: 700;
        }

        .error-message {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Fade in animation */
        .card {
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        /* Save Contact Button */
        .save-contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            padding: 14px 24px;
            margin: 0 auto 30px auto;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c7ab8 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 58, 95, 0.3);
            text-decoration: none;
            position: relative;
            z-index: 2;
        }

        .save-contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 95, 0.4);
        }

        .save-contact-btn:active {
            transform: translateY(0);
        }

        .save-contact-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        /* Clickable info items */
        .info-item a {
            color: #333333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .info-item a:hover {
            color: #1e3a5f;
        }
    </style>
</head>

<body>
    <!-- Loading State -->
    <div id="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- Error State (hidden by default) -->
    <div id="error" class="error-container" style="display: none;">
        <div class="error-icon">😕</div>
        <div class="error-title">Card Not Found</div>
        <div class="error-message">The name card you're looking for doesn't exist.<br>Please check the URL and try
            again.</div>
    </div>

    <!-- Card (hidden by default) -->
    <div id="namecard" class="card" style="display: none;">
        <div class="logo">
            <img src="/img/sam-logo-1.png" alt="SAMS Logo">
        </div>

        <div class="name">

            <h1 class="firstname" id="firstname"></h1>
            <h2 class="lastname" id="lastname"></h2>
        </div>

        <div class="info">
            <div class="info-item">
                <div class="icon-position">
                    <img src="/img/contactIcon.png" alt="Contact Icon">
                </div>
                <span id="position"></span>
            </div>

            <div class="info-item">
                <div class="icon-email">
                    <img src="/img/emailIcon.png" alt="Email Icon">
                </div>
                <span id="email"></span>
            </div>

            <div class="info-item">
                <div class="icon-telphone">
                    <img src="/img/telphoneIcon.png" alt="Telphone Icon">
                </div>
                <span id="phone"></span>
            </div>

            <div class="info-item" id="whatsapp-row" style="display: none;">
                <div class="icon-whatsapp">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="#25D366"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5.1-3.9-10.6-6.9z"/></svg>
                </div>
                <span id="whatsapp"></span>
            </div>
        </div>

        <div class="qr-section">
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        // Google Sheet configuration
        const SHEET_ID = '1ZDGGnFiDPoAtccN2EcVSGCaU_qGyZgQN_CtQ4CFbak0';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        // Column index mapping (0-based)
        const COL = {
            NO: 0,
            NAME: 1,
            POSITION: 2,
            EMAIL: 3,
            PHONE: 4,
            DEPARTMENT: 5,
            SLUG: 6,
            // H (7) = reserved
            WHATSAPP: 8
        };

        // Get slug from URL path
        function getSlugFromURL() {
            const path = window.location.pathname;
            // Remove leading/trailing slashes and get the slug
            const slug = path.replace(/^\/+|\/+$/g, '');
            return slug || null;
        }

        // Parse Google Sheet JSON response
        function parseSheetData(responseText) {
            // Google returns: google.visualization.Query.setResponse({...});
            const jsonStr = responseText.match(/google\.visualization\.Query\.setResponse\((.+)\);?/);
            if (!jsonStr || !jsonStr[1]) {
                throw new Error('Failed to parse Google Sheet response');
            }
            return JSON.parse(jsonStr[1]);
        }

        // Find person by slug
        function findPersonBySlug(data, slug) {
            const rows = data.table.rows;
            for (const row of rows) {
                const rowSlug = row.c[COL.SLUG]?.v;
                if (rowSlug && rowSlug.trim().toLowerCase() === slug.trim().toLowerCase()) {
                    return {
                        no: row.c[COL.NO]?.v,
                        name: row.c[COL.NAME]?.v || '',
                        position: row.c[COL.POSITION]?.v || '',
                        email: row.c[COL.EMAIL]?.v || '',
                        phone: row.c[COL.PHONE]?.v || '',
                        department: row.c[COL.DEPARTMENT]?.v?.trim() || '',
                        slug: rowSlug,
                        whatsapp: row.c[COL.WHATSAPP]?.v || ''
                    };
                }
            }
            return null;
        }

        // Split name into first and last name
        function splitName(fullName) {
            const parts = fullName.trim().split(/\s+/);
            if (parts.length === 1) {
                return { firstName: parts[0], lastName: '' };
            }
            return {
                firstName: parts[0],
                lastName: parts.slice(1).join(' ')
            };
        }

        // Format phone number for display
        function formatPhoneDisplay(phone) {
            return phone;
        }

        // Format phone number for tel: link
        function formatPhoneTel(phone) {
            // Remove all non-digit characters, add country code
            const digits = phone.replace(/\D/g, '');
            if (digits.startsWith('0')) {
                return '+66' + digits.substring(1);
            }
            return '+' + digits;
        }

        // Generate QR Code with vCard data
        function generateQRCode(person) {
            const { firstName, lastName } = splitName(person.name);
            const tel = formatPhoneTel(person.phone);

            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${lastName};${firstName};;;`,
                `FN:${person.name}`,
                `ORG:SAMS Engineering`,
                `TITLE:${person.position}`,
                `TEL;TYPE=CELL:${tel}`,
                `EMAIL:${person.email}`,
                'END:VCARD'
            ].join('\n');

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';

            new QRCode(qrContainer, {
                text: vcard,
                width: 150,
                height: 150,
                colorDark: '#1e3a5f',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // Save contact as vCard file
        function saveContact() {
            const person = window._currentPerson;
            if (!person) return;

            const { firstName, lastName } = splitName(person.name);
            const tel = formatPhoneTel(person.phone);

            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${lastName};${firstName};;;`,
                `FN:${person.name}`,
                `ORG:SAMS - Siam Aircraft Maintenance Services`,
                `TITLE:${person.position}`,
                `TEL;TYPE=CELL:${tel}`,
                `EMAIL:${person.email}`,
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${person.name.replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Auto-fit text: shrink font size until it fits in one line
        function autoFitText(el, maxSize, minSize) {
            el.style.fontSize = maxSize + 'px';
            const parent = el.parentElement;
            // Subtract 20 to ensure it leaves a right margin
            while (el.scrollWidth > (parent.clientWidth - 20) && parseInt(el.style.fontSize) > minSize) {
                el.style.fontSize = (parseInt(el.style.fontSize) - 1) + 'px';
            }
        }

        // Render person data to card
        function renderCard(person) {
            const { firstName, lastName } = splitName(person.name);

            // Update page title
            document.title = `${person.name} | SAMS`;

            // Update meta description
            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) {
                metaDesc = document.createElement('meta');
                metaDesc.name = 'description';
                document.head.appendChild(metaDesc);
            }
            metaDesc.content = `${person.name} - ${person.position} at SAMS`;

            // Update iOS home screen title
            const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) appleTitle.content = `${firstName} | SAMS`;

            // Fill in card data
            document.getElementById('firstname').textContent = firstName;
            document.getElementById('lastname').textContent = lastName;
            document.getElementById('position').textContent = person.position;

            // Auto-fit name font size if too long, but don't go smaller than 24px
            autoFitText(document.getElementById('firstname'), 48, 24);
            autoFitText(document.getElementById('lastname'), 48, 24);


            // Email with mailto link
            const emailEl = document.getElementById('email');
            emailEl.innerHTML = `<a href="mailto:${person.email}">${person.email}</a>`;

            // Phone with tel link
            const phoneEl = document.getElementById('phone');
            const telLink = formatPhoneTel(person.phone);
            phoneEl.innerHTML = `<a href="tel:${telLink}">${formatPhoneDisplay(person.phone)}</a>`;

            // WhatsApp with wa.me link
            if (person.whatsapp) {
                const waDigits = person.whatsapp.replace(/\D/g, '');
                const waEl = document.getElementById('whatsapp');
                waEl.innerHTML = `<a href="https://wa.me/${waDigits}" target="_blank">${person.whatsapp}</a>`;
                document.getElementById('whatsapp-row').style.display = 'flex';
            }

            // Generate QR Code
            generateQRCode(person);

            // Store person for save contact button
            window._currentPerson = person;

            // Show card, hide loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('namecard').style.display = 'flex';
        }

        // Show error state
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorEl = document.getElementById('error');
            if (message) {
                errorEl.querySelector('.error-message').innerHTML = message;
            }
            errorEl.style.display = 'flex';
        }

        // Main initialization
        async function init() {
            const slug = getSlugFromURL();

            if (!slug) {
                showError('No name card specified in the URL.<br>Use: <strong>card.sams.aero/your-slug</strong>');
                return;
            }

            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const data = parseSheetData(text);
                const person = findPersonBySlug(data, slug);

                if (!person) {
                    showError(`Card not found for: <strong>${slug}</strong><br>Please check the URL and try again.`);
                    return;
                }

                renderCard(person);
            } catch (error) {
                console.error('Error loading card data:', error);
                showError('Unable to load card data.<br>Please try again later.');
            }
        }

        // Dynamic PWA manifest — sets start_url to the current path
        // so Add-to-Home-Screen opens the correct person's card
        function injectDynamicManifest() {
            const currentPath = window.location.pathname || '/';
            const manifest = {
                name: 'SAMS Name Card',
                short_name: 'SAMS Card',
                description: 'SAMS Engineering - Digital Name Card',
                start_url: currentPath,
                display: 'standalone',
                background_color: '#ffffff',
                theme_color: '#1e3a5f',
                orientation: 'portrait',
                icons: [
                    {
                        src: '/img/sam-logo-1.png',
                        sizes: '192x192',
                        type: 'image/png',
                        purpose: 'any maskable'
                    },
                    {
                        src: '/img/sam-logo-1.png',
                        sizes: '512x512',
                        type: 'image/png',
                        purpose: 'any maskable'
                    }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
        }

        // Run on page load
        injectDynamicManifest();
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
